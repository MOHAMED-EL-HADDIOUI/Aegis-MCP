<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aegis-MCP logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0b1220"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.9"/>
  <!-- shield -->
  <path d="M64 22 L96 34 V64 C96 88 82 102 64 108 C46 102 32 88 32 64 V34 Z"
        fill="none" stroke="url(#bg)" stroke-width="6" stroke-linejoin="round"/>
  <!-- circuit nodes -->
  <circle cx="52" cy="58" r="4" fill="#22d3ee"/>
  <circle cx="76" cy="58" r="4" fill="#22d3ee"/>
  <circle cx="64" cy="76" r="4" fill="#a5b4fc"/>
  <path d="M52 58 H76 M52 58 L64 76 M76 58 L64 76" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- check -->
  <path d="M56 92 L62 98 L73 86" fill="none" stroke="#34d399" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
