version: "1"
rules:
  - name: deny-sensitive-file-read
    action: deny
    when:
      tool: filesystem_read
      path: ~/.ssh
  - name: allow-read-project
    action: allow
    when:
      tool: filesystem_read
      path_prefix: ./workspace
  - name: approve-write-project
    action: require_approval
    when:
      tool: filesystem_write
      path_prefix: ./workspace
  - name: deny-write-outside-workspace
    action: deny
    when:
      tool: filesystem_write
