apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-mcp
  namespace: aegis-mcp
  labels:
    app.kubernetes.io/name: aegis-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aegis-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow only same-namespace traffic to the API port.
    - from:
        - podSelector: {}
      ports:
        - port: 8787
          protocol: TCP
  egress:
    # Allow DNS + same-namespace traffic, but never the cloud metadata IP.
    - to:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - port: 8787
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
