apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis-mcp.fullname" . }}
  labels:
    {{- include "aegis-mcp.labels" . | nindent 4 }}
data:
  aegis.yaml: |
    server:
      mode: {{ .Values.config.serverMode }}
    security:
      fail_closed: {{ .Values.config.failClosed }}
    policy:
      path: {{ .Values.config.policyPath }}
    taint:
      enabled: {{ .Values.config.taintEnabled }}
    classifier:
      enabled: {{ .Values.config.classifierEnabled }}
      provider: {{ .Values.config.classifierProvider }}
    audit:
      enabled: {{ .Values.config.auditEnabled }}
      database: {{ .Values.config.auditDatabase }}
    sandbox:
      enabled: {{ .Values.config.sandboxEnabled }}
    network:
      deny_metadata_endpoints: {{ .Values.config.denyMetadataEndpoints }}
    limits:
      max_request_bytes: {{ .Values.config.maxRequestBytes }}
      request_timeout_ms: {{ .Values.config.requestTimeoutMs }}
