[workspace]
members = [
  "crates/aegis-core",
  "crates/aegis-config",
  "crates/aegis-protocol",
  "crates/aegis-policy",
  "crates/aegis-taint",
  "crates/aegis-security",
  "crates/aegis-classifier",
  "crates/aegis-audit",
  "crates/aegis-sandbox",
  "crates/aegis-observability",
  "crates/aegis-proxy",
  "crates/aegis-cli",
  "crates/aegis-fuzz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
url = "2"
ipnet = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_yaml = "0.9"
hex = "0.4"
once_cell = "1"
shell-words = "1"
sqlparser = "0.52"
prometheus = "0.13"
async-trait = "0.1"
rand = "0.8"
axum = { version = "0.7", features = ["json"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
aegis-core = { path = "crates/aegis-core" }
aegis-config = { path = "crates/aegis-config" }
aegis-protocol = { path = "crates/aegis-protocol" }
aegis-policy = { path = "crates/aegis-policy" }
aegis-taint = { path = "crates/aegis-taint" }
aegis-security = { path = "crates/aegis-security" }
aegis-classifier = { path = "crates/aegis-classifier" }
aegis-audit = { path = "crates/aegis-audit" }
aegis-sandbox = { path = "crates/aegis-sandbox" }
aegis-observability = { path = "crates/aegis-observability" }
aegis-proxy = { path = "crates/aegis-proxy" }
